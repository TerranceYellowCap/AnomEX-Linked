<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AnomEx: Linked</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/favicon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#000000">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style id="ldCss">
#ld{position:fixed;inset:0;z-index:99999;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease,visibility .5s;font-family:'Chakra Petch',system-ui,sans-serif}
#ld.done{opacity:0;visibility:hidden;pointer-events:none}
#ld .lg{font-weight:700;font-size:clamp(28px,9vw,44px);letter-spacing:.32em;padding-left:.32em}
#ld .lg span{display:block;font-size:.4em;letter-spacing:.6em;padding-left:.6em;text-align:center;color:#8a8a8a;margin-top:4px}
#ld .bar{width:min(60vw,240px);height:3px;background:#222;overflow:hidden}
#ld .bar i{display:block;height:100%;width:0;background:#fff;transition:width .2s}
#ld small{font:400 10px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.3em;color:#777;text-transform:uppercase}
#ld .sc{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none}
</style>

</head>
<body>
<div id="ld" role="status" aria-live="polite"><div class="sc"></div><div class="lg">ANOMEX<span>LINKED</span></div><div class="bar"><i></i></div><small id="ldT">Linking archive</small></div>
<script>
(function(){
  var files=['str','agi','brn','data'].map(function(k){return 'icons/'+k+'.png'}).concat(['agi.png','argithia.png','argo.png','brn.png','cathy.png','cray.png','data.png','delilah.png','echidna.png','edica.png','ellie.png','frey.png','jane.png','julian.png','mason.png','miera.png','neko.png','nessy.png','opal.png','rarity.png','str.png','tyrees.png','wraith.png','wren.png'].map(function(n){return 'icons/'+n}));
  var total=files.length+2, got=0, t0=Date.now(), fin=false, bar=document.querySelector('#ld .bar i'), tx=document.getElementById('ldT');
  function step(){ got++; bar.style.width=Math.min(100,Math.round(got/total*100))+'%'; if(got>=total) done(); }
  function done(){ if(fin) return; fin=true; var wait=Math.max(0,700-(Date.now()-t0)); setTimeout(function(){ var l=document.getElementById('ld'); l.classList.add('done'); setTimeout(function(){ if(l.parentNode) l.parentNode.removeChild(l); },700); },wait); }
  files.forEach(function(f){ var i=new Image(); i.onload=i.onerror=function(){ if(i.decode){ i.decode().then(step,step); } else step(); }; i.src=f; });
  (document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,4000)})]):Promise.resolve()).then(step);
  if(document.readyState==='complete') step(); else window.addEventListener('load',step);
  setTimeout(done,9000);
})();
</script>
<div id="app">
  <header id="top">
    <div id="brand"><b>ANOMEX</b><span>LINKED</span></div>
    <div id="turnTag"><span id="turnWho">Loading</span><span id="turnNo"></span></div>
    <nav id="chips" aria-label="Game menu">
      <button class="chip" id="btnOpt" type="button">Options</button>
    </nav>
  </header>
  <main id="stage">
    <div id="cam"><div id="board" aria-label="Game board"></div></div>
    <div id="layer"></div>
    <button id="btnBack" type="button" aria-label="Back">&#9664; BACK</button>
    <button id="btnSkip" type="button" hidden>SKIP TURN</button>
  </main>
  <footer id="dock">
    <div id="hint" aria-live="polite"></div>
    <div id="ticker" aria-live="polite"></div>
  </footer>
</div>

<div id="dimmer" aria-hidden="true"></div>
<div id="fxlayer"></div>
<div id="podlayer"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>
<div id="tip" role="tooltip"></div>
<div id="visor" aria-hidden="true"><div class="scan"></div><div class="band"></div><div class="vig"></div><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></div>

<div id="arrange" class="ov" role="dialog" aria-label="Squad order"></div>
<div id="inspect" class="ov" role="dialog" aria-label="Agent details"></div>
<div id="panel" class="ov" role="dialog"></div>
<div id="over" class="ov" role="dialog" aria-label="Duel result"></div>
<div id="onl" class="ov" role="dialog" aria-label="Online duel"></div>

<script src="engine.js"></script>
<script src="peerjs.min.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
</body>
</html>
