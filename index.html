<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AnomEx: Linked</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand"><b>ANOMEX</b><span>LINKED</span></div>
    <div id="turnTag"><span id="turnWho">Loading</span><span id="turnNo"></span></div>
    <nav id="chips" aria-label="Game menu">
      <button class="chip" id="btnOpt" type="button">Options</button>
    </nav>
  </header>
  <main id="stage">
    <div id="cam"><div id="board" aria-label="Game board"></div></div>
    <div id="layer"></div>
    <button id="btnBack" type="button" aria-label="Back">&#9664; BACK</button>
    <button id="btnSkip" type="button" hidden>SKIP TURN</button>
  </main>
  <footer id="dock">
    <div id="hint" aria-live="polite"></div>
    <div id="ticker" aria-live="polite"></div>
  </footer>
</div>

<div id="dimmer" aria-hidden="true"></div>
<div id="fxlayer"></div>
<div id="podlayer"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>
<div id="tip" role="tooltip"></div>
<div id="visor" aria-hidden="true"><div class="scan"></div><div class="band"></div><div class="vig"></div><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></div>

<div id="arrange" class="ov" role="dialog" aria-label="Squad order"></div>
<div id="inspect" class="ov" role="dialog" aria-label="Agent details"></div>
<div id="panel" class="ov" role="dialog"></div>
<div id="over" class="ov" role="dialog" aria-label="Duel result"></div>
<div id="onl" class="ov" role="dialog" aria-label="Online duel"></div>

<script src="engine.js"></script>
<script src="peerjs.min.js"></script>
<script src="net.js"></script>
<script src="ui.js"></script>
</body>
</html>
